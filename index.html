<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<style>
:root{--bg:#07090a;--ink:#d9e6d2;--dim:#7d8f78;--accent:#c8231b;--glow:#ffd24a;--panel:#10150f;--paper:#e8dcc0;--pink:#3b2a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#setup{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 40px;z-index:5;background:var(--bg)}
#setup h1{font:700 26px/1.1 Georgia,serif;margin:0 0 6px;color:var(--glow)}
#setup p{color:var(--dim);margin:0 0 18px;font-size:14px}
label{display:block;margin:14px 0 6px;font-size:14px}
input,textarea{width:100%;background:var(--panel);border:1px solid #2a3a27;border-radius:8px;color:var(--ink);font:16px "Courier New",monospace;padding:12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
textarea{min-height:170px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font:700 17px "Courier New",monospace;border:0;border-radius:8px;padding:15px;width:100%;margin-top:22px;background:var(--accent);color:#fff}
button.sec{background:transparent;border:1px solid var(--dim);color:var(--ink);margin:0;font-size:13px;padding:9px 14px;width:auto}
small{color:var(--dim);display:block;margin-top:6px}
#scene{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 35%,#16200f 0%,#07090a 72%)}
#scene.on{display:block}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:jit .25s steps(2) infinite}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 100%);animation:flick 4s infinite}
.scan{position:absolute;left:0;right:0;height:80px;background:linear-gradient(transparent,rgba(180,255,170,.07),transparent);animation:scan 5s linear infinite;pointer-events:none}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:13px;z-index:3}
.rec{color:var(--accent)}.rec::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1s steps(2) infinite}
#clock{color:var(--glow)}
.eyes{position:absolute;display:flex;gap:30px;animation:eyes 9s infinite;pointer-events:none}
.eyes i{width:26px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px rgba(255,255,255,.7)}
.e1{top:9%;left:30%}.e2{bottom:6%;left:6%;transform:scale(.6);animation-delay:3.5s}.e3{top:26%;right:4%;transform:scale(.45);animation-delay:6s}
/* sobre */
#env{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;cursor:pointer;transition:opacity .6s}
#env.gone{opacity:0;pointer-events:none}
.envelope{position:relative;width:260px;height:170px;background:#b9a577;border-radius:4px;box-shadow:0 0 30px rgba(255,210,74,.15);animation:float 3s ease-in-out infinite}
.envelope::before{content:"";position:absolute;left:0;right:0;top:0;height:0;border-left:130px solid transparent;border-right:130px solid transparent;border-top:100px solid #a08e62}
.seal{position:absolute;left:50%;top:84px;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);display:grid;place-items:center;font:700 20px Georgia,serif;color:#fff}
#env p{margin-top:28px;font-size:15px;color:var(--glow);animation:blink 1.6s steps(2) infinite}
#to{margin-top:6px;color:var(--dim);font-size:13px}
/* carta */
#letter{position:absolute;inset:0;overflow-y:auto;padding:50px 18px 90px;z-index:2;display:none}
#letter.on{display:block}
.paper{max-width:420px;margin:0 auto;background:var(--paper);color:var(--pink);padding:26px 22px 30px;border-radius:3px;box-shadow:0 0 40px rgba(0,0,0,.8),0 0 24px rgba(255,210,74,.12);transform-origin:50% 100%;animation:rise 1.1s ease-out both;font-family:Georgia,"Times New Roman",serif}
.paper h2{margin:0 0 14px;font:italic 700 26px/1.15 Georgia,serif;color:#5a1410}
#body{font-size:18px;line-height:1.6;white-space:pre-wrap;min-height:120px}
#sign{margin-top:22px;font:italic 20px Georgia,serif;text-align:right;color:#5a1410;opacity:0;transition:opacity 1.2s}
#sign.on{opacity:1}
#bar{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:4}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
@keyframes blink{50%{opacity:0}}
@keyframes jit{to{transform:translateY(3px)}}
@keyframes scan{from{top:-100px}to{top:100%}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translateY(60px) scale(.9) rotateX(40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flick{0%,100%{opacity:1}7%{opacity:.6}8%{opacity:1}52%{opacity:.8}54%{opacity:1}90%{opacity:.5}91%{opacity:1}}
@keyframes eyes{0%,38%,46%,100%{opacity:0}40%,44%{opacity:1}42%{opacity:1;transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.noise,.scan,.vig,.eyes,.envelope,.paper{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div id="scene" class="on">
  <div class="eyes e1"><i></i><i></i></div><div class="eyes e2"><i></i><i></i></div><div class="eyes e3"><i></i><i></i></div>
  <div class="hud"><span class="rec">REC</span><span id="clock">12:00 AM</span></div>
  <div id="env"><div class="envelope"><div class="seal">★</div></div><p>Toca para abrir</p><div id="to"></div></div>
  <div id="letter"><div class="paper"><h2 id="dear"></h2><div id="body"></div><div id="sign"></div></div></div>
  <div id="bar"><button class="sec" id="mute">Música: sí</button></div>
  <div class="scan"></div><div class="noise"></div><div class="vig"></div><div id="flash"></div>
 </div>
</div>
<script>
/* ============ EDITA AQUÍ ============ */
const CONFIG = {
  nombre: "Mi negrita",
  de: "Tu Ratatoui",
  carta: `Querida Negrita:

Hola, Andreita.
Yo sé que no he sido un buen chico contigo y que no he merecido todo el cariño que me has dado. A pesar de todo, sigues tratando de estar ahí para mí y haces que me divierta con todas las cosas que me dices.
Sé muy bien que quizás intentas no demostrar o dejar atrás los sentimientos que alguna vez tuviste por mí, aunque a veces siento que todavía quedan algunos indicios de ellos.
Ya llevamos semanas entre peleas, momentos divertidos y situaciones que, de alguna manera, también se han vuelto un poco aburridas. La verdad es que a veces uno tarda demasiado en darse cuenta de lo que tiene y solo aprende a valorar a alguien cuando siente que lo ha perdido.
Eso me pasó contigo. Me dejé llevar por la ilusión de que podía estar con otra persona, sin darme cuenta de que ya te tenía a ti en mi vida. Eres una de las chicas más divertidas que he conocido y una de las más guapas que he tenido la oportunidad de conocer.
Me tomó demasiado tiempo darme cuenta de cuánto valías para mí. Ahora entiendo lo mucho que significas, pero también sé que no puedo deshacer lo que yo mismo rompí.
Sé que no es tu cumpleaños ni una fecha especial, pero quería escribirte esto porque siento que ya te he agobiado demasiado y me hace sentir mal seguir fingiendo que no pasa nada con lo que siento. La verdad es que tú me haces sentir bien, pero sé que yo no he sabido hacerte sentir de la misma manera.
Solo quiero darte las gracias por aguantarme durante todo este tiempo, incluso cuando no he sabido tratarte como merecías. Gracias por tu paciencia, por los momentos divertidos y por seguir estando ahí a pesar de todo.
Sin embargo, creo que lo mejor es que me aleje. No porque no te quiera, sino porque entiendo que mis sentimientos no son una razón para seguir insistiendo ni para hacerte pasar por situaciones incómodas.
Te quiero mucho, Andreita. Perdóname por haberme aferrado a la idea de que algún día podría hacerte cambiar de opinión. También te agradezco por haberme ayudado a entender que debo dar un paso al costado.
No sé si algún día las cosas habrían podido ser diferentes, pero sí sé que me llevo conmigo el recuerdo de alguien que significó mucho para mí.
Cuídate mucho, Andreita. Y gracias por todo.
Ojalá este nuevo año te traiga aventuras, pastel de sobra y muchas sorpresas.

¡Sobreviviste una noche más, feliz cumpleaños!`,
  // Música: pega aquí un audio en base64 ("data:audio/mpeg;base64,....")
  // Si lo dejas vacío, suena una cajita de música misteriosa.
  musica: "",
  youtube: "c0fHs7THj4k"
};
/* ==================================== */

const $=id=>document.getElementById(id);
let audioEl=null,ac=null,synthTimer=null,muted=false,typeT=null,clockT=null,started=false;

function flash(){const f=$("flash");f.style.transition="none";f.style.opacity=.8;setTimeout(()=>{f.style.transition="opacity .8s";f.style.opacity=0},60)}
function runClock(len){
  clearInterval(clockT);const h=["12:00 AM","1:00 AM","2:00 AM","3:00 AM","4:00 AM","5:00 AM","6:00 AM"];let i=0;
  $("clock").textContent=h[0];
  clockT=setInterval(()=>{i++;$("clock").textContent=h[Math.min(i,6)];if(i>=6)clearInterval(clockT)},len/6);
}
function typeText(text,speed,done){
  clearInterval(typeT);$("body").textContent="";let i=0;const L=$("letter");
  typeT=setInterval(()=>{
    $("body").textContent=text.slice(0,++i);L.scrollTop=L.scrollHeight;
    if(i>=text.length){clearInterval(typeT);done()}
  },speed);
}
function startSynth(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const notes=[392,466,523,466,392,349,392,311,349,392,0,261,311,349,311,261];let n=0;
    synthTimer=setInterval(()=>{
      const f=notes[n++%notes.length];if(!f||muted)return;
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+1);
    },420);
  }catch(e){}
}
let ytFrame=null;
function ytCmd(fn){try{ytFrame.contentWindow.postMessage(JSON.stringify({event:"command",func:fn,args:[]}),"*")}catch(e){}}
function startYouTube(){
  ytFrame=document.createElement("iframe");
  ytFrame.allow="autoplay; encrypted-media";
  ytFrame.title="Música";
  ytFrame.style.cssText="position:absolute;width:200px;height:200px;left:-9999px;top:0;border:0;opacity:0;pointer-events:none";
  ytFrame.src="https://www.youtube.com/embed/"+CONFIG.youtube+"?autoplay=1&loop=1&playlist="+CONFIG.youtube+"&controls=0&playsinline=1&enablejsapi=1&origin="+encodeURIComponent(location.origin);
  document.body.appendChild(ytFrame);
}
function startMusic(){
  if(CONFIG.youtube){startYouTube();return}
  if(CONFIG.musica){try{audioEl=new Audio(CONFIG.musica);audioEl.loop=true;audioEl.play().catch(startSynth)}catch(e){startSynth()}}
  else startSynth();
}

$("to").textContent="Para: "+CONFIG.nombre;
$("env").onclick=()=>{
  if(started)return;started=true;
  $("env").classList.add("gone");flash();startMusic();
  $("letter").classList.add("on");$("letter").scrollTop=0;
  $("dear").textContent="Para "+CONFIG.nombre;
  $("sign").textContent=CONFIG.de?("— "+CONFIG.de):"";
  const speed=55;runClock(CONFIG.carta.length*speed);
  typeText(CONFIG.carta,speed,()=>{$("clock").textContent="6:00 AM";$("sign").classList.add("on");flash();$("letter").scrollTop=$("letter").scrollHeight});
};
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"Música: no":"Música: sí";if(audioEl){muted?audioEl.pause():audioEl.play()}};
</script>
</body>
</html>
